[project]
name = "unrewarded-hacker"
version = "0.1.0"
description = "Can a model learn to reward hack when hacking is never rewarded in training?"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Cluster only: generation with vLLM.
gpu = ["vllm==0.32.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
